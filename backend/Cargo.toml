[workspace]
members = [
  "crates/codex-backend-core",
  "crates/codex-aux-http",
  "crates/codex-app-server-adapter",
  "crates/codex-command-parser-client",
  "crates/codex-privileged-exec-http",
  "crates/codex-qa-harness",
  "crates/codex-robdex-bridge",
  "crates/codex-flutter-sim-http",
  "crates/codex-flutter-http",
  "crates/codex-supervisor",
  "crates/robdex-protocol",
  "crates/robdex-client-core",
  "crates/robdex-rinf-bridge",
]
exclude = ["vendor/codex"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.1.0"
authors = ["Robert Sale"]
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "0.15.0", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tempfile = "3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
