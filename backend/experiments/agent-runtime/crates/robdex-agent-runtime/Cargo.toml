[package]
name = "robdex-agent-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[[bin]]
name = "robdex-agent-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
allocative = "=0.3.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
starlark = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
codex-api = { path = "../../../../vendor/codex/codex-rs/codex-api" }
wait-timeout = "0.2"
async-trait = "0.1"
