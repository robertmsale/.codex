[package]
name = "robdex-agent-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[[bin]]
name = "robdex-agent-runtime"
path = "src/main.rs"

[[bin]]
name = "robdex-agent-runtime-server"
path = "src/server_main.rs"

[[bin]]
name = "robdex-agent-runtime-server-validation-client"
path = "src/server_validation_client.rs"

[dependencies]
anyhow = "1"
allocative = "=0.3.4"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
starlark = { version = "0.13", default-features = false }
starlark_map = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util", "net", "sync", "signal"] }
tokio-tungstenite = "0.27"
uuid = { version = "1", features = ["v4", "serde"] }
codex-api = { path = "../../../../vendor/codex/codex-rs/codex-api" }
codex-models-manager = { path = "../../../../vendor/codex/codex-rs/models-manager" }
codex-protocol = { path = "../../../../vendor/codex/codex-rs/protocol" }
wait-timeout = "0.2"
async-trait = "0.1"
libc = "0.2"
once_cell = "1"
base64 = "0.22"
robdex-agent-runtime-projection = { path = "../robdex-agent-runtime-projection" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
