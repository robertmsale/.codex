[project]
name = "sync-gitops-http"
version = "0.1.0"
description = "HTTP bridge that exposes guarded host-side gitops operations to synced VM worktrees"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12.0",
  "fastapi>=0.115.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "PyGithub>=2.5.0",
  "uvicorn>=0.32.0",
  "fb-idb>=1.1.7",
]

[project.scripts]
sync-gitops-http = "sync_services_http.server:main"
sync-flutter-sim-http = "sync_services_http.flutter_sim_server:main"
sync-flutter-drive-http = "sync_services_http.flutter_drive_server:main"
sync-flutter-http = "sync_services_http.flutter_exec_server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_services_http"]

[tool.uv]
package = true
