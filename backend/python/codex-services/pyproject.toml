[project]
name = "codex-host-services"
version = "0.1.0"
description = "Host-side support services for Codex Flutter and auxiliary workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12.0",
  "fastapi>=0.115.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "PyGithub>=2.5.0",
  "uvicorn>=0.32.0",
  "fb-idb>=1.1.7",
]

[project.scripts]
codex-flutter-sim-http = "codex_services_http.flutter_sim_server:main"
codex-flutter-http = "codex_services_http.flutter_exec_server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_services_http"]

[tool.uv]
package = true
