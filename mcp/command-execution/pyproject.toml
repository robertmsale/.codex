[project]
name = "command-execution-mcp"
version = "0.1.0"
description = "MCP server for filesystem-backed long-running command jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0.0",
]

[project.scripts]
command-execution-mcp = "command_execution_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
