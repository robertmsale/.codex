[project]
name = "robdex-orchestrator-mcp"
version = "0.1.0"
description = "MCP server for robdex bridge orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0.0",
  "websockets>=12.0",
]

[project.scripts]
robdex-orchestrator-mcp = "robdex_orchestrator_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
