<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Robdex design lab">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robdex Design Lab</title>
    <link rel="manifest" href="manifest.json">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111820;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        function markReadyWhenFlutterPaints() {
          var hasFlutterSurface = document.querySelector('flutter-view, flt-glass-pane, canvas');
          if (hasFlutterSurface) {
            window.__designLabReady = {
              ready: true,
              surface: new URLSearchParams(window.location.search).get('surface') || 'shell'
            };
            return;
          }
          window.requestAnimationFrame(markReadyWhenFlutterPaints);
        }
        window.requestAnimationFrame(markReadyWhenFlutterPaints);
      })();
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
