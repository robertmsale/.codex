id: rinf-requirements
title: Rinf Requirements
description: Use for Flutter frontend work in projects that use Rinf. Covers the Dart/Rust boundary, Rinf-managed state/storage, and preserving generated signal files.
appliesTo:
  - frontend
  - product
  - generated-artifacts
requirements:
  - key: rinfFrontendBoundaryPreserved
    statement: Do not add ordinary Dart networking or parallel global state/storage in Rinf frontends. Network requests must be Dart-to-Rust intents via Rinf signals, results must flow back over event streams, and persistent/global state must hydrate through Rinf unless the task explicitly fits an allowed client-device plugin exception such as theme or text-size preferences.
    severity: blocker
    verificationMethod: diffReview
  - key: generatedRinfFilesPreserved
    statement: Changes to Rinf signals must regenerate and keep the generated Dart files. Resolve merge conflicts by rebasing and regenerating; do not discard generated Rinf signal changes as trivial or noisy.
    severity: high
    verificationMethod: manualEvidence
