id: no-legacy
title: No Legacy
description: Use when obsolete behavior, tooling, docs, config, tests, scripts, flags, or generated artifacts must be removed. Requires deletion of legacy artifacts instead of preserving old names, wrappers, tombstones, disabled entrypoints, or compatibility paths.
appliesTo:
  - code
  - UI
  - API
  - tooling
  - docs
  - config
  - generated-artifacts
requirements:
  - key: noLegacyLeftBehind
    statement: Treat the assigned area as clean slate. Delete obsolete code paths, executable scripts, wrappers, aliases, hard-error stubs, tombstone files, deprecated entrypoints, fallback behavior, flags, docs, comments, tests, generated artifacts, config, migration shims, and UI affordances that preserve, describe, advertise, route to, or reserve names for legacy behavior after the replacement is complete. Do not keep compatibility artifacts or disabled legacy entrypoints. This requirement supersedes any requirements where the task has 'delete or ...' language in it. 
    severity: OWNER
    verificationMethod: diffReview
