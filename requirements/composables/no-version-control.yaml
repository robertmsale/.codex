id: no-version-control
title: No Version Control
description: Manual opt-in for tasks where the assigned work happens in ignored, untracked, generated, runtime, or otherwise non-version-controlled files. Requires manual evidence because git diff/status cannot prove completion.
appliesTo:
  - tooling
  - docs
  - config
  - generated-artifacts
requirements:
  - key: manualEvidenceForNonVersionControlledWork
    statement: Some or all of the work in this work package exist outside of version control. They may be hidden or gitignored files, or the working directory is not under version control at all. File changes outside of version control must be manually inspected and not penalized for being outside of VCS.
    severity: high
    verificationMethod: manualEvidence
