id: design-non-negotiables
title: Design Non-Negotiables
description: Use for frontend, product UI, design-system, or UX work. Compactly covers Design Lab visual proof, design-system ownership, truthful functional UI, professional fit-and-finish, accessibility, and responsive workflow quality.
appliesTo:
  - UI
  - code
  - frontend
  - product
requirements:
  - key: designLabVisualProofAndProductionWiring
    statement: Visual proof for Design Lab work must use the project's Design Lab Bun/WebView screenshot path, not Flutter tester pixels. Mock controllers and fixture data are allowed in Design Lab only; production client code must use the intended product wiring and source of truth.
    severity: blocker
    verificationMethod: screenshotReview
  - key: designSystemAndShellOwnership
    statement: Preserve the existing app shell unless shell work is explicitly assigned, and keep static UI copy/prose in the design system or established shared UI source when the project uses one.
    severity: high
    verificationMethod: diffReview
  - key: truthfulFunctionalUI
    statement: Do not implement fake, decorative, placeholder, or non-functional UI for assigned product behavior. Controls, inputs, navigation, filters, toggles, copy, loading, empty, error, permission, unavailable, saved, and selected states must be functional through the intended product path or truthfully marked unavailable with actionable context.
    severity: blocker
    verificationMethod: sourceInspection
  - key: professionalWorkflowUI
    statement: UI must feel production-ready for the target user. clear hierarchy, restrained grouping, purposeful actions, human-friendly copy, legible text, accessible semantics/focus/labels, responsive layouts, and no UUID/dev-note leakage, repeated content, vague dashboard slop, nested cards, one-note color wash, decorative metrics, unclear workflow, overcrowding, incoherent spacing, overlap, clipping, unreadable contrast, accidental overflow, dead empty states, or visually unfinished components. Use `~/.codex/skills/design-worker/assets/good-example.png` and `~/.codex/skills/design-worker/assets/bad-example.png` as calibration references when useful, without trying to match them literally.
    severity: high
    verificationMethod: screenshotReview
